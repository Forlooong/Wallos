user www-data;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # OIDC query strings, tokens and user-controlled private paths are never logged.
    access_log off;
    sendfile on;
    server_tokens off;
    include /etc/nginx/http.d/wallos.conf;
}
