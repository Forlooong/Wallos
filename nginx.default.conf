# Rendered by startup.sh from validated WALLOS_BIND and WALLOS_PORT.
server {
    listen __BIND__:__PORT__;
    server_name _;
    root /var/www/html;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    location = /apps/wallos { return 308 /apps/wallos/; }
    location ^~ /apps/wallos/ { rewrite ^/apps/wallos/(.*)$ /$1 last; }
    # The original URI must carry the App prefix, including direct backend access.
    if ($request_uri !~ "^/apps/wallos(?:/|$)") { return 404; }
    location = / { rewrite ^ /index.php last; }
    location ~ ^/(?:db|includes|libs|vendor|tests|test-results|dev|migrations|\.tmp|\.git)/ { return 404; }
    location ~ ^/endpoints/(?:cronjobs|db)/ { return 403; }
    location ~ ^/images/uploads/logos/(?<private_upload>(?:avatars/)?[A-Za-z0-9_.-]+)$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/wallos.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/html/private_file.php;
        fastcgi_param SCRIPT_NAME /apps/wallos/private_file.php;
        fastcgi_param QUERY_STRING file=$private_upload;
    }
    # Reject every unmatched private-upload path before the public static regex.
    location ~ ^/images/uploads/logos/ { return 404; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/wallos.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME /apps/wallos$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
    }
    location = /service-worker.js {
        add_header Cache-Control no-cache;
        add_header Service-Worker-Allowed /apps/wallos/;
    }
    location ~ ^/(?:styles|scripts|images|webfonts)/.*\.(?:css|js|png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location / { return 404; }
}
